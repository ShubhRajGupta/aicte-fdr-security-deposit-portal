# Prometheus Monitoring Configuration for AICTE FDR Portal
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aicte-fdr-central-monitor'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'fdr-backend-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fdr-backend-service:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(http_server_requests_seconds_.*|jvm_memory_.*|audit_chain_verified|timeline_evaluation_seconds_.*)'
        action: keep

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
